name: Validate and build bilingual paper

on:
  push:
    branches: [main]
    paths:
      - 'paper.*.md'
      - 'scripts/**'
      - 'templates/**'
      - 'Makefile'
      - '.github/workflows/build-bilingual.yml'
  pull_request:
    paths:
      - 'paper.*.md'
      - 'scripts/**'
      - 'templates/**'
      - 'Makefile'
      - '.github/workflows/build-bilingual.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilingual-paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc python3-docx texlive-xetex texlive-latex-extra texlive-lang-chinese texlive-fonts-recommended lmodern fonts-noto-cjk
      - name: Build and check all paired editions
        run: python3 scripts/build_all.py --format
      - name: Confirm clean canonical sources pass read-only checks
        run: python3 scripts/build_all.py --check
      - name: Upload source, publications, checks, and submission package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constitutional-pluralism-bilingual
          if-no-files-found: error
          path: |
            paper.*
            scripts/
            templates/
            build/
            submission/
            docs/
            README.md
            Makefile
      - name: Publish synchronized outputs only for the source commit built
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'A newer source commit exists. Not publishing stale generated outputs.'
            exit 0
          fi
          git add paper.en.md paper.zh.md paper.en.tex paper.zh.tex paper.en.pdf paper.zh.pdf paper.en.html paper.zh.html paper.en.docx paper.zh.docx build/ submission/
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified bilingual submission candidate [skip ci]'
            git push origin HEAD:main
          fi
