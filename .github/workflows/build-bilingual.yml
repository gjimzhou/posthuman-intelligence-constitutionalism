name: Build bilingual paper

on:
  push:
    branches: [main]
    paths:
      - "paper.zh.md"
      - "paper.en.md"
      - "scripts/build_tex.py"
      - "scripts/build_formats.py"
      - "Makefile"
      - ".github/workflows/build-bilingual.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilingual-paper-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-dejavu-core

      - name: Validate bilingual canonical sources and regenerate LaTeX
        run: python3 scripts/build_tex.py

      - name: Build paired HTML and DOCX editions
        run: python3 scripts/build_formats.py

      - name: Compile English PDF
        run: |
          xelatex -interaction=nonstopmode -halt-on-error paper.en.tex
          xelatex -interaction=nonstopmode -halt-on-error paper.en.tex

      - name: Compile Chinese PDF
        run: |
          xelatex -interaction=nonstopmode -halt-on-error paper.zh.tex
          xelatex -interaction=nonstopmode -halt-on-error paper.zh.tex

      - name: Upload complete bilingual document set
        uses: actions/upload-artifact@v4
        with:
          name: posthuman-intelligence-constitutionalism-bilingual
          path: |
            paper.en.md
            paper.zh.md
            paper.en.tex
            paper.zh.tex
            paper.en.pdf
            paper.zh.pdf
            paper.en.html
            paper.zh.html
            paper.en.docx
            paper.zh.docx

      - name: Commit synchronized generated editions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper.en.tex paper.zh.tex \
            paper.en.pdf paper.zh.pdf \
            paper.en.html paper.zh.html \
            paper.en.docx paper.zh.docx
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "Build synchronized bilingual document editions [skip ci]"
            git push
          fi
